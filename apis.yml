aid: aak
name: AAK
description: >-
  AAK AB is a Swedish producer of value-adding plant-based oils and fats, headquartered in Malmö and
  listed on Nasdaq Stockholm (ticker AAK) in the Food & Beverage large-cap segment. It was formed in
  2005 through the merger of Denmark's Aarhus United and Sweden's Karlshamns AB, and describes more
  than 150 years of combined experience in specialty vegetable oils. The company employs roughly
  4,000 people across 19 production facilities, 25 regional sales offices and 16 Customer Innovation
  Centers, and works through a co-development model with customers in chocolate and confectionery,
  bakery, dairy and ice cream, plant-based foods, special nutrition, foodservice and retail, personal
  care, animal nutrition, candles and technical products such as fatty acids and glycerine. Its
  product is a physical industrial ingredient, not software: no developer program, public API, SDK,
  developer portal, machine-readable contract or GitHub organization could be found, and no
  api/developer/docs/portal hostname resolves under aak.com.
